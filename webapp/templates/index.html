<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LoRa Gateway</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <header>
      <nav class="nav">
        <div class="brand">
          <h1>LoRa Gateway</h1>
          <div class="tabs">
            <button class="tab"><a href="/registro">Registro</a></button>
            <button class="tab"><a href="/explorar">Explorar</a></button>
            <button class="tab active"><a href="/" class="active">Configuración</a></button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="card">
        <h2 style="margin:0 0 12px 0;font-size:16px">Configuración</h2>

        <div class="config-box" id="configBox">

          <div class="control">
            <div class="control-header">
              <label for="ventana">Tiempo de medición</label>
              <span class="value" id="ventanaVal">100</span>
            </div>
            <input type="range" id="ventana" min="2" max="254" step="2" value="100" />
          </div>

          <div class="control">
            <div class="control-header">
              <label for="umbral">Umbral de activación</label>
              <span class="value" id="umbralVal">0.50</span>
            </div>
            <input type="range" id="umbral" min="0.1" max="1" step="0.01" value="0.50" />
          </div>

          <div class="control">
            <label for="frecuencia">Frecuencia de muestreo</label>
            <div class="control-row">
              <select id="frecuencia">
                <option value="10">100Hz</option>
                <option value="5">200Hz</option>
                <option value="4">250Hz</option>
                <option value="2">500Hz</option>
                <option value="1">1000Hz</option>
              </select>
            </div>
          </div>

          <div class="control">
            <label for="lora">LoRa</label>
            <div class="control-row">
              <select id="lora">
                <option value="1">SF7 - BW125</option>
                <option value="2">SF7 - BW250</option>
                <option value="3">SF7 - BW500</option>
                <option value="4">SF8 - BW125</option>
                <option value="5">SF9 - BW125</option>
                <option value="6">SF10 - BW125</option>
              </select>
            </div>
          </div>

        </div>

        <div class="config">
          <div class="config-dev">
            <select id="device">
              <option value="16">Sensor 1</option>
              <option value="32">Sensor 2</option>
              <option value="48">Sensor 3</option>
              <option value="64">Sensor 4</option>
              <option value="255">Todos</option>
            </select>
          </div>
          <div class="config-clock">
            <button class="mode-btn" data-command="sync">Sincronizar</button>
          </div>
          <div class="config-btn">
            <button class="mode-btn" data-command="configurar">Configurar</button>
          </div>
        </div>
      </section>

      <section class="bottom">
        <div class="card card-content">
          <h3 style="margin:0 0 15px 0">Status</h3>
          <div class="detect-group">
            <button class="mode-btn" data-command="detectar">Detectar</button>
            <div class="leds-container">
              <div class="led-wrapper">
                <div class="led" id="led-16"></div>
                <span class="led-label">1</span>
              </div>
    
              <div class="led-wrapper">
                <div class="led" id="led-32"></div>
                <span class="led-label">2</span>
              </div>
    
              <div class="led-wrapper">
                <div class="led" id="led-48"></div>
                <span class="led-label">3</span>
              </div>
    
              <div class="led-wrapper">
                <div class="led" id="led-64"></div>
                <span class="led-label">4</span>
              </div>
            </div>
          </div>
          <h3 style="margin:0 0 8px 0">Modos</h3>
          <div class="modes-list" id="modesList">
            <button class="mode-btn active" data-command="standby">Standby</button>
            <button class="mode-btn inactive" data-command="eventos">Eventos</button>
            <button class="mode-btn inactive" data-command="tiempo">Tiempo</button>
            <button class="mode-btn inactive" data-command="programado">Programado</button>
          </div>
          <!-- <div style="margin-top:auto;color:var(--muted);font-size:13px">Modo activo: <span id="modoActivo">standby</span></div> -->
        </div>

        <div class="card card-content">
          <h3 style="margin:0 0 8px 0">Monitor</h3>

          <div class="monitor-wrapper" id="monitorWrapper">
            <div class="monitor-feed" id="monitorFeed"></div>
          </div>
        </div>
      </section>

    </main>
  </div>

    <!-- Modal de Sincronización de Reloj -->
  <div id="syncModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>¿Qué tipo de sincronización desea?</h3>
      <div class="modal-actions">
        <!-- Botones detectables por javascript usando data-command -->
        <button class="mode-btn inactive" data-command="sync_simple">Simple</button>
        <button class="mode-btn active" data-command="sync_completa">Completa</button>
        <button class="mode-btn inactive" id="cancelSync">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
